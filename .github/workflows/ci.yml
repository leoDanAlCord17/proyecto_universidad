name: CI

on:
  push:
    branches: [main, develop, master, main-pwa, dev-leo-pwa]
  pull_request:
    branches: [main, develop, master, main-pwa, dev-leo-pwa]

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato de código
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Análisis estático
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar tests con cobertura
        run: flutter test --no-pub --coverage

      - name: Verificar umbral mínimo de cobertura (60%)
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | grep -oP '\d+\.\d+(?=%)' | head -1)
          echo "Cobertura de líneas: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Cobertura ${COVERAGE}% es menor al mínimo requerido (60%)"
            exit 1
          fi
          echo "✅ Cobertura ${COVERAGE}% supera el umbral mínimo"

      - name: Subir reporte de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

  build_web:
    name: Build Web (PWA)
    runs-on: ubuntu-latest
    # Solo construye en push a ramas principales, no en cada PR para ahorrar minutos
    if: github.event_name == 'push'
    needs: analyze_and_test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Crea el archivo .env en tiempo de ejecución desde los secretos de GitHub.
      # NUNCA subir .env al repositorio — configurar SUPABASE_URL y
      # SUPABASE_ANON_KEY en Settings > Secrets and variables > Actions.
      - name: Crear .env desde secretos
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Build web (PWA offline-first)
        run: |
          flutter build web \
            --release \
            --pwa-strategy=offline-first \
            --dart-define-from-file=.env \
            --base-href=/

      - name: Subir artefacto web
        uses: actions/upload-artifact@v4
        with:
          name: web-pwa-build
          path: build/web/
          retention-days: 7

      - name: Deploy a Vercel
        working-directory: ./build/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@48.0.0
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
