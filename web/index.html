<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Si sirves la app desde una subruta, cambia el href de base para que
    comience y termine con "/". Ejemplo: href="/uniasist/"
    Más info: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
    Este es un placeholder que Flutter reemplaza con --base-href.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UniAsist — Sistema de gestión de asistencia universitaria con eventos, escaneo QR y estadísticas.">
  <meta name="theme-color" content="#5B3FD4">

  <!-- iOS / Safari PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UniAsist">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">

  <title>UniAsist</title>
</head>
<body>
  <!-- Flutter carga y monta la app aquí -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Registra el service worker de Firebase para notificaciones push en segundo plano -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js');
    }
  </script>
</body>
</html>
