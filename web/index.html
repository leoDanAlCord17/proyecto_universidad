<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Si sirves la app desde una subruta, cambia el href de base para que
    comience y termine con "/". Ejemplo: href="/activiti/"
    Más info: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
    Este es un placeholder que Flutter reemplaza con --base-href.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    html, body {
      overscroll-behavior: none;
    }

    /* ── Splash HTML/CSS nativo ────────────────────────────────────────────
       Visible desde el primer byte de HTML, antes de que el motor de Flutter
       termine de descargarse e inicializar — evita la pantalla en blanco en
       conexiones lentas. Se remueve en cuanto el motor dispara su primer
       frame (ver el script al final de <body>). Usa los mismos colores que
       manifest.json / theme-color para que la transición sea imperceptible. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #EEEDF5;
      transition: opacity 0.25s ease-out;
    }

    #splash.splash-oculto {
      opacity: 0;
      pointer-events: none;
    }

    #splash .splash-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
    }

    #splash .splash-anillo {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(91, 63, 212, 0.18);
      border-top-color: #5B3FD4;
      border-radius: 50%;
      animation: splash-girar 0.8s linear infinite;
    }

    #splash .splash-texto {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #5B3FD4;
      letter-spacing: 0.2px;
    }

    @keyframes splash-girar {
      to { transform: rotate(360deg); }
    }

    @media (prefers-color-scheme: dark) {
      #splash { background: #14121F; }
    }
  </style>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Activity — Sistema de gestión de asistencia universitaria con eventos, escaneo QR y estadísticas.">
  <meta name="theme-color" content="#5B3FD4">

  <!-- iOS / Safari PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Activity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">

  <title>Activity</title>
</head>
<body>
  <!-- Splash nativo — visible de inmediato, sin depender de Flutter/JS pesado.
       Se remueve con el listener de 'flutter-first-frame' más abajo. -->
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Activity" class="splash-logo">
    <div class="splash-anillo"></div>
    <div class="splash-texto">Cargando Activity...</div>
  </div>

  <!-- Flutter carga y monta la app aquí -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // ── Remueve el splash nativo en cuanto Flutter pinta su primer frame ────
    // 'flutter-first-frame' lo dispara el propio engine en window una vez que
    // el árbol de widgets ya se renderizó — a partir de ahí el splash HTML
    // sobra y se desvanece suavemente antes de quitarse del DOM.
    (function () {
      var yaOculto = false;
      function ocultarSplash() {
        if (yaOculto) return;
        yaOculto = true;
        var splash = document.getElementById('splash');
        if (!splash) return;
        splash.classList.add('splash-oculto');
        splash.addEventListener('transitionend', function () {
          splash.remove();
        });
        // Respaldo por si 'transitionend' no dispara (pestaña en segundo plano, etc.)
        setTimeout(function () { splash.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', ocultarSplash);
    })();

    if ('serviceWorker' in navigator) {
      // ── Firebase SW — push notifications en segundo plano ──────────────────
      // Scope propio y distinto de "/" para no competir por el control de la
      // página con flutter_service_worker.js (que registra en el scope raíz
      // para el caching offline-first de la PWA). Dos Service Workers en el
      // mismo scope solo dejan a uno activo como controller, lo que puede
      // degradar intermitentemente el caching o la recepción de push.
      navigator.serviceWorker.register('/firebase-messaging-sw.js', {
        scope: '/firebase-cloud-messaging-push-scope',
      });

      // ── Actualización automática del Service Worker ────────────────────────
      // Flutter genera flutter_service_worker.js con un hash único por build.
      // El browser detecta el archivo nuevo, lo instala en segundo plano y,
      // una vez activo, esta lógica recarga la app para mostrar la versión
      // más reciente sin que el usuario tenga que desinstalar ni recargar.

      let _recargando = false;

      // Guarda el controlador actual ANTES de que cambie.
      // Si era null (primera instalación) no recargamos — solo cuando hay
      // una versión previa que está siendo reemplazada por la nueva.
      const _controladorPrevio = navigator.serviceWorker.controller;

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_controladorPrevio && !_recargando) {
          _recargando = true;
          window.location.reload();
        }
      });

      // Fuerza la activación si el nuevo SW quedó en estado "waiting".
      // Esto ocurre cuando el usuario tiene la app abierta en varias pestañas:
      // el browser instala el SW nuevo pero no lo activa hasta que todas
      // las pestañas con la versión anterior se cierren. El mensaje
      // SKIP_WAITING le dice al SW que tome control inmediatamente.
      navigator.serviceWorker.ready.then((reg) => {
        const activar = (sw) => {
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              sw.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        };

        // Caso A: ya hay un SW en espera cuando la página termina de cargar
        if (reg.waiting) activar(reg.waiting);

        // Caso B: el nuevo SW comienza a instalarse después de la carga
        reg.addEventListener('updatefound', () => {
          if (reg.installing) activar(reg.installing);
        });
      });
    }
  </script>
</body>
</html>
