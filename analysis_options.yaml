include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Tratar como errores para forzar corrección
    missing_required_param:      error
    missing_return:              error
    invalid_assignment:          error
    # Tratar como warnings para visibilidad sin bloquear build
    dead_code:                   warning
    unused_import:               warning
    unused_local_variable:       warning

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # ── Calidad de código ──────────────────────────────────────────
    avoid_print: true                        # Usa el logger, no print()
    avoid_dynamic_calls: true               # Evita llamadas a dynamic sin cast
    always_declare_return_types: true       # Toda función debe declarar su retorno
    unawaited_futures: true                 # Detecta Futures sin await accidental

    # ── Rendimiento ────────────────────────────────────────────────
    prefer_const_constructors: true         # Widget(const param) cuando es posible
    prefer_const_declarations: true         # const para variables que no cambian
    prefer_const_literals_to_create_immutables: true

    # ── Estilo y legibilidad ───────────────────────────────────────
    prefer_single_quotes: true              # Consistencia: siempre comillas simples
    require_trailing_commas: true           # Mejor diff en git, formato automático
    use_super_parameters: true              # super.key en lugar de key: key
    unnecessary_lambdas: true              # No envolver llamadas simples en lambda
    sort_constructors_first: true          # Constructores antes que campos

    # ── Seguridad y corrección ─────────────────────────────────────
    avoid_catching_errors: true            # No capturar Error, solo Exception
    cancel_subscriptions: true             # StreamSubscription debe cancelarse
    close_sinks: true                      # Sinks deben cerrarse

    # ── Null safety ────────────────────────────────────────────────
    avoid_null_checks_in_equality_operators: true
